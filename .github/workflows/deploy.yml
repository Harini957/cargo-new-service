name: Deploy Cargo Website to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate website
        run: |
          test -f index.html
          test -d css
          test -d js
          echo "Website validation successful"

      - name: Check EC2 secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "ERROR: EC2_HOST secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.EC2_USERNAME }}" ]; then
            echo "ERROR: EC2_USERNAME secret is missing"
            exit 1
          fi

          echo "EC2_HOST and EC2_USERNAME are available"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create website archive
        run: |
          tar --exclude='.git' -czf /tmp/cargo-website.tar.gz .

      - name: Copy website to EC2
        run: |
          scp /tmp/cargo-website.tar.gz \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/

      - name: Deploy website to Nginx
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            sudo rm -rf /var/www/html/*
            sudo tar -xzf /tmp/cargo-website.tar.gz -C /var/www/html
            sudo rm -f /tmp/cargo-website.tar.gz
            sudo systemctl reload nginx
          "

      - name: Deployment successful
        run: echo "Cargo website deployed successfully to EC2"
